<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>

    <header>
        <h1>To Do App</h1>
    </header>

    <nav>
        <div id="button-display">
            <button id="projectAddBtn">Add Project</button>
            <button id="taskAddBtn">Add Task</button>
        </div>
        <div id="project-display">
            <h2>Projects</h2>
            <div id="project-list">
                <ul></ul>
            </div>
        </div>
    </nav>

    <div id="task-area">
        <h3>Todos</h3>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Priority</th>
                    <th>Complete</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <dialog id="projectDialogModal">
        <form id="projectForm">
            <div>
                <label for="project-name">Name: </label>
                <input id="project-name" name="project-name" type="text" placeholder="Project Name" required/>
            </div>
            <button id="projectSubmitBtn" type="submit">Add Project</button>
        </form>
        <div id="projectClose">
            <button id="projectCloseBtn">Close</button>
        </div>
    </dialog>

    <!-- <dialog id="taskDialogModal"></dialog> -->

</body>
</html>
